name: Update Project Status

on:
  push:
    branches: [ "main" ]
    paths:
      - "scripts/generate-project-status.cjs"
      - "data/status-overrides.json"
      - "src/**"
      - "data/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write  # needed to push the updated status file

concurrency:
  group: project-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: true  # use GITHUB_TOKEN for push
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'   # matches your local v22.17.x
          cache: 'npm'

      - name: Install (if needed)
        run: npm ci --ignore-scripts

      - name: Generate project status
        run: npm run status:gen

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- project_status.md; then
            echo "No changes to project_status.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project_status.md
          git commit -m "ci(status): refresh project_status.md [skip ci]"
          git push
